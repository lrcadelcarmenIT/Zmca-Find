  :root{

    --line:#000000;
    --danger:#B23A2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--base);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:300;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:56px;}
  .brand-mark{display:none;}
  .brand-name{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:34px;
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 14px;
    text-transform:uppercase;
  }
  .sub{color:var(--steel-dark);font-size:14px;font-weight:300;line-height:1.6;margin:0 0 40px;max-width:46ch;}
  .panel{
    background:var(--surface);
    border:none;
    border-top:1px solid var(--line);
    padding:32px 0 0;
    position:relative;
  }
  .gauge-row{display:none;}
  .step-info{flex:1;}
  .step-label{font-family:'Inter',sans-serif;font-weight:400;font-size:11px;letter-spacing:0.2em;color:var(--steel-dark);text-transform:uppercase;margin:0 0 24px;}
  .step-num{display:none;}
  .q-title{font-family:'Inter',sans-serif;font-weight:400;font-size:20px;line-height:1.3;margin:0 0 28px;text-transform:none;letter-spacing:0;}
  .opts{display:flex;flex-direction:column;margin-bottom:32px;}
  .opt{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 4px;
    border:none;
    border-bottom:1px solid #E3E3E3;
    background:var(--surface);
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:300;
    letter-spacing:0.02em;
    color:var(--ink);
    transition:opacity .12s;
    flex-direction:row-reverse;
  }
  .opt:hover{opacity:0.5;}
  .opt.sel{font-weight:500;}
  .opt.sel::after{content:"—";}
  .opt-tag{font-family:'Inter',sans-serif;font-size:10px;color:var(--steel);letter-spacing:0.05em;flex-shrink:0;text-transform:uppercase;}
  .nav-row{display:flex;justify-content:space-between;gap:10px;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    padding:15px 22px;
    border:1px solid var(--ink);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
  }
  button.primary{background:var(--ink);color:#FFFFFF;border-color:var(--ink);}
  button.primary:hover{background:#FFFFFF;color:var(--ink);}
  button:disabled{opacity:0.25;cursor:not-allowed;}
  button:not(:disabled):hover{background:var(--ink);color:#FFFFFF;}
  button.primary:not(:disabled):hover{background:#FFFFFF;color:var(--ink);}

  .nameplate{border:none;border-top:1px solid var(--line);background:var(--surface);padding:24px 0;margin-bottom:0;position:relative;box-shadow:none;}
  .nameplate-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;border-bottom:none;padding-bottom:0;}
  .np-rank{font-family:'Inter',sans-serif;font-size:10px;background:none;color:var(--steel-dark);padding:0;font-weight:400;letter-spacing:0.2em;text-transform:uppercase;}
  .np-fit{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);font-weight:400;}
  .np-name{font-family:'Inter',sans-serif;font-weight:400;font-size:17px;text-transform:none;margin:6px 0 6px;line-height:1.3;letter-spacing:0.01em;}
  .np-desc{font-size:13px;color:var(--steel-dark);font-weight:300;line-height:1.6;margin:0 0 16px;}
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E3E3E3;border:none;margin-top:14px;}
  .spec-cell{background:var(--surface);padding:10px 0;}
  .spec-k{font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:0.12em;color:var(--steel);margin:0 0 4px;font-weight:400;}
  .spec-v{font-size:13px;font-weight:300;margin:0;}
  .why{margin-top:14px;padding-top:14px;border-top:none;}

  .checklist h3{font-family:'Inter',sans-serif;font-weight:400;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;margin:0 0 20px;}
  .checklist ul{list-style:none;margin:0;padding:0;}
  .checklist li{display:flex;gap:9px;font-size:13px;font-weight:300;line-height:1.6;padding-bottom:16px;color:var(--steel-dark);}
  .checklist li::before{content:none;}
  .checklist ul.flat li{justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #E3E3E3;}
  .checklist ul.flat li::before{content:none;}

  .restart{width:100%;margin-top:16px;}
  .empty{text-align:center;padding:40px 10px;color:var(--steel-dark);font-size:13px;font-weight:300;}
  .hist-link{background:none;border:none;font-family:'Inter',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--steel-dark);text-decoration:none;border-bottom:1px solid var(--steel-dark);cursor:pointer;padding:0 0 2px;margin-bottom:18px;display:inline-block;font-weight:400;}
  .err{color:var(--danger);font-size:12px;font-weight:300;margin:-10px 0 14px;}
  textarea{font-weight:300 !important;border-radius:0 !important;}
  .cat-photo{width:100%;max-height:220px;object-fit:cover;filter:grayscale(1) contrast(1.05);border:1px solid var(--line);margin:-6px 0 28px;display:block;}
  .item-thumb{width:26px;height:26px;object-fit:cover;filter:grayscale(1);border:1px solid #E3E3E3;flex-shrink:0;margin-right:8px;}
  .item-name{display:flex;align-items:center;}

function matchWorkflow(text){
  const t = text.toLowerCase();
  let best = null, bestScore = 0;
  WORKFLOWS.forEach(w => {
    let score = 0;
    w.triggers.forEach(trig => { if(t.includes(trig)) score += trig.split(' ').length; });
    if(score > bestScore){ bestScore = score; best = w; }
  });
  if(best) return best;
  const catHit = CATEGORIES.find(c => t.includes(c.toLowerCase().split(' ')[0]));
  if(catHit){
    return {name:catHit, desc:`Machines in the ${catHit} category.`, items: CATALOG.filter(m=>m.cat===catHit).slice(0,5).map(m=>m.name)};
  }
  return null;
}

const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

function findItem(name){ return CATALOG.find(m => m.name === name); }

function bundleTotal(items){
  return items.reduce((sum,n) => { const it = findItem(n); return sum + (it && it.price ? it.price : 0); }, 0);
}

let state = {step:0, answers:{}, screen:'quiz', results:null, history:[]};

function getResults(a){
  const budget = BUDGET_OPTIONS.find(b => b.v === a.budget);
  const min = budget.v === 'b1' ? 0 : BUDGET_OPTIONS[BUDGET_OPTIONS.indexOf(budget)-1].max;
  const inBudget = PRICED.filter(m => m.cat === a.category && m.price >= min && m.price <= budget.max);
  const rest = PRICED.filter(m => m.cat === a.category && !(m.price >= min && m.price <= budget.max))
    .sort((x,y) => Math.abs(x.price-min) - Math.abs(y.price-min));
  const unpriced = CATALOG.filter(m => m.cat === a.category && m.price === null);
  return { inBudget: inBudget.sort((x,y)=>x.price-y.price), rest: rest.slice(0,3), unpriced };
}

async function saveToHistory(a, results){
  try{
    const entry = {id:Date.now().toString(), date:new Date().toISOString(), category:a.category, count: results.inBudget.length};
    let list = [];
    try{ const r = await storage.get('history'); if(r) list = JSON.parse(r.value); }catch(e){}
    list.unshift(entry);
    list = list.slice(0,20);
    await storage.set('history', JSON.stringify(list));
  }catch(e){}
}

async function loadHistory(){
  try{
    const r = await storage.get('history');
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}

function selectOpt(key, val){
  state.answers[key] = val;
  document.getElementById('errbox').innerHTML = '';
  render();
}

function nextStep(){
  const key = state.step === 0 ? 'category' : 'budget';
  if(!state.answers[key]){
    document.getElementById('errbox').innerHTML = '<p class="err">Pick an option to continue.</p>';
    return;
  }
  if(state.step < 1){
    state.step++;
    render();
  } else {
    const results = getResults(state.answers);
    state.results = results;
    state.screen = 'results';
    saveToHistory(state.answers, results);
    render();
  }
}

function prevStep(){
  if(state.step > 0){ state.step--; render(); }
}

function restart(){
  state = {step:0, answers:{}, screen:'quiz', results:null, history:[]};
  render();
}

const WORKER_URL = 'https://zmca-find-search.lr-cadelcarmen.workers.dev/';

async function aiMatch(val){
  try{
    const resp = await fetch(WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query: val, catalog: CATALOG })
    });
    if(!resp.ok) return null;
    const data = await resp.json();
    if(!data.match || !Array.isArray(data.items) || !data.items.length) return null;
    return { name: data.name || 'Recommended Line', desc: data.desc || '', items: data.items };
  }catch(e){
    return null;
  }
}

async function runIntent(){
  const val = document.getElementById('intentInput').value.trim();
  if(!val){
    document.getElementById('intentErr').innerHTML = '<p class="err">Describe your product first.</p>';
    return;
  }
  document.getElementById('intentErr').innerHTML = '<p class="sub" style="margin:0 0 14px;">Thinking…</p>';

  let w = await aiMatch(val);
  if(!w) w = matchWorkflow(val); // fallback to local keyword matcher if the AI backend is unavailable
  document.getElementById('intentErr').innerHTML = '';

  state.intentResult = w;
  state.screen = 'intent-results';
  if(w){
    (async()=>{
      try{
        const entry = {id:Date.now().toString(), date:new Date().toISOString(), category:w.name, count: w.items.length};
        let list = [];
        try{ const r = await storage.get('history'); if(r) list = JSON.parse(r.value); }catch(e){}
        list.unshift(entry);
        list = list.slice(0,20);
        await storage.set('history', JSON.stringify(list));
      }catch(e){}
    })();
  }
  render();
}

function showHistory(){

function showBundles(){
